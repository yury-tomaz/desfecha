name: verify

on:
  push:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
      # O token fica só neste passo: o verify.sh instala dependências de terceiros e não deve vê-lo.
      - name: zizmor com as auditorias online
        run: mise exec -- zizmor --no-progress .github/workflows
        env:
          GH_TOKEN: ${{ github.token }}
      - run: scripts/verify.sh
