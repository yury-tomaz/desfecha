name: verify

on:
  push:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # O histórico inteiro traz o origin/main: a mutação mede o que mudou desde o merge-base com ele.
          fetch-depth: 0
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      # O token fica só neste passo: o verify.sh instala dependências de terceiros e não deve vê-lo.
      - name: zizmor com as auditorias online
        run: mise exec -- zizmor --no-progress .github/workflows
        env:
          GH_TOKEN: ${{ github.token }}
      - run: scripts/verify.sh
